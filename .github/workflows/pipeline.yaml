name: Deploy CRM Strapi

on:
  push:
    branches: ["dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Strapi via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 22.14.0

            echo "📌 Entering Strapi directory"
            cd /home/ubuntu/clawbaby_admin

            echo "📌 Pulling latest changes"
            git pull https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PAT }}@github.com/rajaaselvam93/clawbaby_admin/.git dev

            echo "📌 Installing dependencies"
            npm run build

            echo "📌 Restarting PM2 Strapi"
            pm2 stop Strapi || true
            pm2 delete Strapi || true
            pm2 start "npm run develop" --name Strapi
            pm2 save